  <rect width="100" height="100" rx="22" fill="#0A0A0A"/>
  
  <!-- Outer accent rings -->
  <rect x="6" y="6" width="88" height="88" rx="16" fill="none" stroke="#FF5500" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Lightning Bolt/Stress Wave Graph representing pipelining high load -->
